<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="fm" allowfullscreen></iframe>
<script>
(async function () {
  const url = "https://cdn.jsdelivr.net/gh/isaidgg5/bookish-pancake@main/lite.html?t=" + Date.now();
  try {
    const html = await (await fetch(url)).text();
    const fm = document.getElementById("fm");
    const doc = fm.contentDocument || fm.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
  } catch (err) {
    console.error("loader error:", err);
    document.body.textContent = "Failed to load: " + err.message;
  }
})();
</script>
</body>
</html>
